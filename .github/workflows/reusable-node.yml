name: Pipeline Reutilizable Node

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
        description: 'Version de Node.js a utilizar'
    outputs:
      nombre_artifact:
        description: 'El nombre del artifact generado'
        value: ${{ jobs.build.outputs.art_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      art_name: ${{ steps.set_output.outputs.mi_artifact }}
      
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4 

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cache dependencias NPM
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ inputs.node_version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node_version }}-

      - name: Instalacion y Tests (Simulado para el lab)
        run: |
          mkdir -p dist logs
          echo "Codigo compilado" > dist/main.js
          echo "Todos los tests pasaron correctamente" > test-report.txt
          echo "Logs de ejecucion" > logs/app.log

      - name: Subir Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app-release-${{ inputs.node_version }}
          path: |
            dist/
            test-report.txt
            logs/
          retention-days: 5

      - name: Set Output
        id: set_output
        run: echo "mi_artifact=node-app-release-${{ inputs.node_version }}" >> $GITHUB_OUTPUT
